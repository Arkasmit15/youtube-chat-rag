<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; margin: 0; font-family: system-ui, sans-serif; font-size: 14px; }
    header { padding: 10px 12px; background: #c00; color: #fff; font-weight: 600; }
    #status { padding: 6px 12px; font-size: 12px; color: #555; background: #f4f4f4; }
    #chat { height: 300px; overflow-y: auto; padding: 10px 12px; }
    .msg { margin: 6px 0; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e8f0fe; margin-left: 30px; }
    .bot { background: #f1f1f1; margin-right: 30px; }
    footer { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 12px; border: 0; background: #c00; color: #fff; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>
  <header>YouTube Chat</header>
  <div id="status">Starting...</div>
  <div id="chat"></div>
  <footer>
    <input id="q" placeholder="Ask about this video..." disabled />
    <button id="send" disabled>Ask</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
